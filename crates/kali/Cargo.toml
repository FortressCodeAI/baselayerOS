[package]
name = "kali"
version = "0.1.0"
edition = "2021"
authors = ["James Archer-Lewis"]
description = "Kali — Deterministic AI Operating System"
license = "MIT"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["full"] }
wasmtime = "18.0.0"
wasmtime-wasi = "18.0.0"
