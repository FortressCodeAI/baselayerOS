[package]
name = "baselayeros-cli"
version = "1.0.0"
edition = "2021"
description = "BaseLayerOS CLI for deterministic execution, replay, and evidence generation"
license = "MIT"

[[bin]]
name = "bl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }

substrate = { path = "../crates/substrate" }
